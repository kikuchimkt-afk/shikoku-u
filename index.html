<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>四国大学 英語入試対策</title>
    <meta name="description" content="四国大学の英語入試を完全対策。過去問53問＋模擬試験200問収録。">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');

        body {
            font-family: 'Noto Sans JP', sans-serif;
        }

        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: url('https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=1920') center/cover;
            filter: blur(8px) brightness(0.8);
            transform: scale(1.1);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.8), rgba(118, 75, 162, 0.7), rgba(240, 147, 251, 0.6));
        }

        .glass {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .float-anim {
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0)
            }

            50% {
                transform: translateY(-10px)
            }
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-container"></div>
    <div class="bg-overlay"></div>

    <div class="max-w-2xl w-full">
        <!-- Hero -->
        <div class="glass rounded-3xl p-10 md:p-16 text-center text-white mb-8">
            <div class="text-7xl mb-6 float-anim">📚</div>
            <h1 class="text-4xl md:text-5xl font-black mb-4">四国大学<br>英語入試 完全対策</h1>
            <p class="text-white/80 text-lg mb-2">過去問53問＋模擬試験200問収録</p>
            <p class="text-white/60 text-sm">全問詳細解説付き・苦手問題自動記録</p>
        </div>

        <!-- Menu Cards -->
        <div class="grid md:grid-cols-2 gap-4">
            <a href="app.html" class="glass-card rounded-2xl p-6 text-center hover:scale-105 transition-all block">
                <div class="text-4xl mb-3">🎯</div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">問題演習</h2>
                <p class="text-sm text-slate-500">過去問・模擬試験を解く</p>
                <div
                    class="mt-4 bg-gradient-to-r from-blue-500 to-purple-600 text-white px-6 py-2 rounded-xl inline-block font-bold">
                    <i class="fa-solid fa-play mr-2"></i>スタート
                </div>
            </a>
            <a href="dashboard.html"
                class="glass-card rounded-2xl p-6 text-center hover:scale-105 transition-all block">
                <div class="text-4xl mb-3">📊</div>
                <h2 class="text-xl font-bold text-slate-800 mb-2">入試分析</h2>
                <p class="text-sm text-slate-500">出題傾向・配点を確認</p>
                <div
                    class="mt-4 bg-gradient-to-r from-amber-500 to-orange-600 text-white px-6 py-2 rounded-xl inline-block font-bold">
                    <i class="fa-solid fa-chart-pie mr-2"></i>分析を見る
                </div>
            </a>
        </div>

        <!-- Footer -->
        <p class="text-center text-white/50 text-xs mt-8">© 2026 四国大学英語入試対策アプリ</p>
    </div>
</body>

</html>
